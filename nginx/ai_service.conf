server {
    listen 80;
    listen 443 ssl;
    server_name _;
    
    # SSL 配置
    ssl_certificate /var/www/html/ai_service/nginx/ai_service.crt;
    ssl_certificate_key /var/www/html/ai_service/nginx/ai_service.key;
    
    # SSL 优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    
    # HSTS 配置（可选）
    add_header Strict-Transport-Security "max-age=63072000" always;
    
    root /var/www/html/ai_service/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # 日志配置
    access_log /var/log/nginx/ai_service_access.log;
    error_log /var/log/nginx/ai_service_error.log;
}

# HTTP 重定向到 HTTPS（可选）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}